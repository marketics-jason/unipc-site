# UNIPC — static site. No build step; publish the repository root.
[build]
  publish = "."

# Security + privacy headers (no trackers; this site sets none itself).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), interest-cohort=()"

# Assets revalidate on every load (ETag → 304 when unchanged) so CSS/JS updates
# propagate during active iteration. Switch to a long immutable cache with
# filename/version hashing at launch.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, no-cache"

# Font files never change — safe to cache hard (more specific rule wins for fonts).
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
